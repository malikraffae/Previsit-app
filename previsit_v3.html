<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PreVisit — get ready for your appointment</title>
<style>
  :root{
    --bg:#FAF8F4;
    --card:#FFFFFF;
    --ink:#22302B;
    --ink-soft:#5B6B64;
    --ink-faint:#96A39C;
    --teal:#1F6F5C;
    --teal-dark:#154D40;
    --teal-tint:#E5F1EC;
    --coral:#C1633F;
    --coral-tint:#F7E9E1;
    --red:#B23A2F;
    --red-tint:#FBEAE7;
    --amber:#A06A1E;
    --amber-tint:#FBF1E0;
    --line:#E4DFD3;
    --line-strong:#CFC8B6;
    --radius:10px;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
  h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--ink);margin:0;}
  .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);font-weight:600;}
  .lede{color:var(--ink-soft);font-size:15px;line-height:1.5;margin-top:.4rem;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem;margin-top:1.25rem;}
  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:.35rem;margin-top:1rem;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=date], input[type=password], input[type=email], textarea, select{
    width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:.6rem .7rem;
    font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff;
  }
  textarea{resize:vertical;min-height:64px;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.6rem;align-items:center;}
  .row2{display:grid;grid-template-columns:1fr 1fr auto;gap:.6rem;align-items:center;}
  @media (max-width:560px){ .row{grid-template-columns:1fr;} .row3,.row2{grid-template-columns:1fr;} }
  .pillgroup{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem;}
  .pill{border:1px solid var(--line-strong);border-radius:999px;padding:.4rem .85rem;font-size:13px;cursor:pointer;background:#fff;color:var(--ink-soft);user-select:none;}
  .pill.active{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-dark);font-weight:600;}
  .listrow{display:flex;gap:.5rem;margin-top:.6rem;align-items:center;}
  .listrow input{flex:1;}
  .btn{border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:.55rem 1rem;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;font-family:var(--sans);}
  .btn:hover{border-color:var(--teal);}
  .btn-primary{background:var(--teal);border-color:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{border:none;background:none;color:var(--coral);font-weight:600;padding:.3rem .4rem;cursor:pointer;font-family:var(--sans);}
  .btn-sm{padding:.4rem .7rem;font-size:13px;}
  .actions{display:flex;gap:.75rem;margin-top:1.75rem;flex-wrap:wrap;}
  .chip-remove{cursor:pointer;color:var(--ink-faint);}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:.3rem;}
  .summary h3{margin-top:1.4rem;font-size:16px;}
  .summary h3:first-child{margin-top:0;}
  .field-line{display:flex;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:14px;}
  .field-line .k{width:150px;flex-shrink:0;color:var(--ink-soft);font-weight:600;}
  .field-line .v{color:var(--ink);}
  .qlist{list-style:none;margin:.5rem 0 0;padding:0;}
  .qlist li{display:flex;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:14px;}
  .qlist li:last-child{border-bottom:none;}
  .qnum{color:var(--teal);font-weight:600;flex-shrink:0;}
  .badge{display:inline-block;background:var(--coral-tint);color:var(--coral);font-size:12px;font-weight:600;padding:.2rem .6rem;border-radius:6px;margin-bottom:.75rem;}
  .disclaimer{font-size:12px;color:var(--ink-faint);border-top:1px solid var(--line);margin-top:1.5rem;padding-top:1rem;line-height:1.6;}
  .progress{display:flex;gap:.4rem;margin:1.5rem 0 0;}
  .progress .seg{flex:1;height:3px;background:var(--line);border-radius:2px;}
  .progress .seg.done{background:var(--teal);}
  .hidden{display:none;}
  .banner{border-radius:var(--radius);padding:1rem 1.1rem;margin-top:1.25rem;}
  .banner-red{background:var(--red-tint);border:1px solid #E3B3AB;}
  .banner-red .btitle{color:var(--red);}
  .banner-amber{background:var(--amber-tint);border:1px solid #E6CFA0;}
  .banner-amber .btitle{color:var(--amber);}
  .btitle{font-weight:700;font-size:14px;margin-bottom:.3rem;}
  .bbody{font-size:13.5px;color:var(--ink-soft);}
  .bbody ul{margin:.4rem 0 0;padding-left:1.1rem;}
  .topbar{max-width:720px;margin:0 auto;padding:1rem 1.5rem 0;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;}
  .topbar .brandmark{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--teal-dark);}
  .topbar .tools{display:flex;gap:1rem;align-items:center;font-size:13px;}
  .topbar select{width:auto;padding:.35rem .5rem;font-size:12.5px;}
  .section-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-top:1.1rem;}
  .section-title:first-child{margin-top:0;}
  .photo-grid{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.6rem;}
  .photo-thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line-strong);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb span{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;font-size:10px;padding:1px 4px;cursor:pointer;}
  table.dash{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.dash th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink-faint);padding:.5rem;border-bottom:1px solid var(--line);}
  table.dash td{padding:.6rem .5rem;border-bottom:1px solid var(--line);vertical-align:top;cursor:pointer;}
  table.dash tr:hover td{background:var(--teal-tint);}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem;}
  .dot.red{background:var(--red);} .dot.amber{background:var(--amber);} .dot.gray{background:#C7CFC9;}
  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .card{border:none;padding:0;}
  }
</style>
</head>

// Chief-complaint classifier. Simple keyword match for the MVP — a great
// candidate to later replace with a small LLM classification call, but the
// question/red-flag *content* below is what a physician should own either way.
const CATEGORY_KEYWORDS = {
  chest_pain: ['chest pain','chest pressure','chest tightness','dolor de pecho'],
  headache: ['headache','migraine','head pain','dolor de cabeza'],
  abdominal_pain: ['stomach','abdominal','belly','abdomen','nausea','dolor de estómago','dolor abdominal'],
  respiratory: ['cough','shortness of breath','breathing','wheeze','tos','respirar'],
  skin: ['rash','skin','itch','hives','sarpullido','piel'],
  musculoskeletal: ['back pain','joint','knee','shoulder','muscle','espalda','articulación'],
  urinary: ['urination','urinary','bladder','orinar'],
  mental_health: ['anxious','anxiety','depressed','depression','mood','ansiedad','depresión'],
};
function categorize(text){
  const s = (text||'').toLowerCase();
  for(const cat in CATEGORY_KEYWORDS){
    if(CATEGORY_KEYWORDS[cat].some(k=>s.includes(k))) return cat;
  }
  return 'general';
}

// Deterministic, physician-editable red-flag rules — deliberately not AI-generated.
function evaluateRedFlags(){
  const a = State.adaptive, cat = State.category, flags = [];
  function add(id, level, msg){ flags.push({id, level, msg}); }

  if(cat==='chest_pain' && (a.radiates||a.sob||a.sweating))
    add('cp','urgent','Chest pain with radiation, shortness of breath, or sweating can indicate a cardiac event.');
  if(cat==='headache' && a.worst_ever)
    add('hdr1','urgent','A sudden, "worst-ever" headache can indicate a serious neurological event.');
  if(cat==='headache' && a.fever_stiffneck)
    add('hdr2','urgent','Headache with fever and neck stiffness can indicate meningitis.');
  if(cat==='headache' && a.vision_changes)
    add('hdr3','urgent','Headache with vision change, confusion, weakness, or speech trouble needs urgent evaluation.');
  if(cat==='abdominal_pain' && a.vomiting_blood)
    add('abd','urgent','Vomiting blood or black/bloody stool can indicate GI bleeding.');
  if(cat==='respiratory' && a.sob_rest)
    add('resp1','urgent','Shortness of breath at rest needs prompt evaluation.');
  if(cat==='respiratory' && a.blood_sputum)
    add('resp2','urgent','Coughing up blood needs prompt evaluation.');
  if(cat==='skin' && a.face_throat_swelling)
    add('skin1','urgent','Facial/throat swelling or trouble breathing with a rash can indicate a severe allergic reaction.');
  if(cat==='skin' && a.painful_blistering)
    add('skin2','warn','Painful blistering or peeling skin should be seen promptly.');
  if(cat==='musculoskeletal' && a.bowel_bladder)
    add('back','urgent','New loss of bladder or bowel control with back pain can indicate a surgical emergency.');
  if(cat==='urinary' && a.fever_flank)
    add('uri','warn','Fever with flank pain and urinary symptoms can indicate a kidney infection.');
  if(cat==='mental_health' && a.safety)
    add('mh','urgent','Reported thoughts of self-harm or harming others require immediate attention. If in immediate danger, call or text 988 (Suicide & Crisis Lifeline) or 911.');
  if(a.worsening_rapid)
    add('gen','warn','Symptoms worsening over hours rather than days warrant closer attention.');
  if(State.intake.severity === t('sev_sev'))
    add('sev','warn','Patient reports symptoms severe enough to impair function.');

  return flags.sort((x,y)=> (x.level==='urgent'?-1:1) - (y.level==='urgent'?-1:1));
}
function evaluateScreenerFlags(){
  const s = State.screeners, flags = [];
  const phq = (s.phq1||0)+(s.phq2||0);
  const gad = (s.gad1||0)+(s.gad2||0);
  if(phq>=3) flags.push({id:'phq', level:'warn', msg:`PHQ-2 score ${phq}/6 — positive screen for depression (cutoff ≥3). Consider full PHQ-9.`});
  if(gad>=3) flags.push({id:'gad', level:'warn', msg:`GAD-2 score ${gad}/6 — positive screen for anxiety (cutoff ≥3). Consider full GAD-7.`});
  return flags;
}

// HPI generation: tries an optional backend endpoint first (for a real LLM call
// via your own server-side API key — see note in README section at bottom of
// this file), and always falls back to this deterministic clinical-language
// template so the app works with zero backend setup.
function buildTemplateHPI(){
  const i = State.intake, a = State.adaptive;
  const parts = [];
  parts.push(`Patient presents with ${i.chief || 'the reported concern'}${i.onset ? ', onset ' + i.onset : ''}.`);
  const sevMap = {};
  sevMap[t('sev_mild')] = 'Severity is mild and not functionally limiting.';
  sevMap[t('sev_mod')] = 'Severity is moderate, affecting daily activities.';
  sevMap[t('sev_sev')] = 'Severity is severe, significantly impairing function.';
  if(sevMap[i.severity]) parts.push(sevMap[i.severity]);
  if(i.pattern.length) parts.push(`Course is described as ${i.pattern.join(', ').toLowerCase()}.`);
  if(i.assoc) parts.push(`Associated symptoms include: ${i.assoc}.`);
  if(i.tried) parts.push(`Patient has already tried: ${i.tried}.`);
  if(i.history) parts.push(`Relevant history: ${i.history}.`);
  const positives = Object.keys(a).filter(k=>a[k]===true).map(k=>k.replace(/_/g,' '));
  if(positives.length) parts.push(`Pertinent positives on targeted questioning: ${positives.join(', ')}.`);
  return parts.filter(Boolean).join(' ');
}
async function generateHPI(){
  try{
    const res = await fetch('/api/generate-hpi', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ intake: State.intake, adaptive: State.adaptive, category: State.category })
    });
    if(res.ok){ const data = await res.json(); if(data && data.hpi) return {text:data.hpi, source:'ai'}; }
  }catch(e){ /* no backend configured — fall back below */ }
  return { text: buildTemplateHPI(), source:'template' };
}

// SOAP note: Subjective is assembled from patient-entered intake (safe — it's
// literally what the patient reported). Objective is deliberately left as a
// placeholder for the clinician — vitals/exam can't come from a self-report
// form. Assessment/Plan reuse the differential and recommendations above so
// there's exactly one place each is generated.
function buildTemplateSOAP(hpiText, ddx, reco, flags){
  const i = State.intake;
  const s = [hpiText];
  if(State.ros.length) s.push(`ROS positive for: ${State.ros.join(', ')}.`);
  if(State.meds.length) s.push(`Current medications: ${State.meds.map(m=>`${m.name} ${m.dose} ${m.freq}`).join('; ')}.`);
  if(State.allergies.length) s.push(`Allergies: ${State.allergies.map(a=>`${a.allergen} (${a.reaction})`).join('; ')}.`);
  else s.push('Allergies: none reported.');
  const o = t('soap_o_placeholder');
  const aParts = [];
  if(flags.some(f=>f.level==='urgent')) aParts.push('Patient-reported features flagged as potentially urgent — clinician to assess emergently before proceeding with routine visit.');
  aParts.push(`Differential to consider (unconfirmed): ${ddx.items.join(', ')}.`);
  const p = reco.items.map(r=>`- ${r}`).join('\n');
  return { s: s.join(' '), o, a: aParts.join(' '), p };
}
async function generateSOAPNote(hpi, ddx, reco, flags){
  try{
    const res = await fetch('/api/generate-soap', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ intake: State.intake, adaptive: State.adaptive, ros: State.ros, meds: State.meds,
        allergies: State.allergies, category: State.category, hpi: hpi.text, differential: ddx.items, recommendations: reco.items })
    });
    if(res.ok){ const data = await res.json(); if(data && data.s){ return { s:data.s, o:data.o||t('soap_o_placeholder'), a:data.a, p:data.p, source:'ai' }; } }
  }catch(e){ /* no backend configured — fall back below */ }
  return Object.assign(buildTemplateSOAP(hpi.text, ddx, reco, flags), {source:'template'});
}

/* ============================= EHR / FHIR EXPORT ============================= */
// Builds a FHIR-*shaped* bundle from the visit so a real backend integration has
// something to map from. This does NOT talk to an actual EHR — real EHR
// integration requires a server-side SMART on FHIR OAuth2 client and the health
// system's approval, which cannot live in client-side code. See build notes.
function buildFHIRBundle(visit){
  const patientRef = 'urn:uuid:' + visit.patientId;
  const entries = [
    { resource: { resourceType:'Patient', id: visit.patientId, name:[{text: visit.patientName||'Unknown'}] } },
    { resource: { resourceType:'Condition', code:{text: visit.intake.chief}, subject:{reference: patientRef},
        onsetString: visit.intake.onset||undefined, note:[{text: visit.hpi.text}] } },
    { resource: { resourceType:'DocumentReference', status:'current', type:{text:'Pre-visit intake summary'},
        subject:{reference: patientRef}, date: visit.createdAt,
        content:[{ attachment:{ contentType:'text/plain', data: btoa(unescape(encodeURIComponent(visit.hpi.text))) } }] } },
  ];
  (visit.meds||[]).forEach(m=> entries.push({ resource:{ resourceType:'MedicationStatement', status:'active',
    medicationCodeableConcept:{text:m.name}, dosage:[{text:`${m.dose} ${m.freq}`}], subject:{reference:patientRef} } }));
  (visit.allergies||[]).forEach(a=> entries.push({ resource:{ resourceType:'AllergyIntolerance',
    code:{text:a.allergen}, reaction:[{description:a.reaction}], patient:{reference:patientRef} } }));
  if(visit.soap) entries.push({ resource:{ resourceType:'DocumentReference', status:'current', type:{text:'SOAP note (draft, unsigned)'},
    subject:{reference: patientRef}, date: visit.createdAt,
    content:[{ attachment:{ contentType:'text/plain', data: btoa(unescape(encodeURIComponent(
      `S: ${visit.soap.s}\nO: ${visit.soap.o}\nA: ${visit.soap.a}\nP: ${visit.soap.p}`))) } }] } });
  return { resourceType:'Bundle', type:'collection', timestamp: new Date().toISOString(), entry: entries };
}
function exportFHIR(visitId){
  const visit = getAllVisits().find(v=>v.id===visitId);
  if(!visit) return;
  const bundle = buildFHIRBundle(visit);
  const blob = new Blob([JSON.stringify(bundle,null,2)], {type:'application/fhir+json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `previsit-${visit.id}-fhir.json`; a.click();
  URL.revokeObjectURL(url);
}
async function sendToEHR(visitId){
  const visit = getAllVisits().find(v=>v.id===visitId);
  if(!visit) return;
  const bundle = buildFHIRBundle(visit);
  try{
    const res = await fetch('/api/ehr-export', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(bundle)
    });
    if(res.ok){ alert('Sent to EHR backend.'); return; }
    throw new Error('backend rejected');
  }catch(e){
    alert('No EHR backend configured at /api/ehr-export — downloading the FHIR bundle instead so it can be uploaded manually or wired into your integration engine.');
    exportFHIR(visitId);
  }
}

function readJSON(key, fallback){ try{ return JSON.parse(localStorage.getItem(key)) || fallback; }catch(e){ return fallback; } }

// Backend-first persistence: tries POST /api/visits (wire this to your real,
// compliant database) and always also caches to localStorage so the app keeps
// working with zero backend and the doctor dashboard has something to read
// synchronously. This is a caching layer, not compliant storage on its own —

async function saveVisit(visit){
  writeJSON('previsit_visits', [visit, ...readJSON('previsit_visits', [])]);
  try{
    await fetch('/api/visits', {

    });
  }catch(e){ /* no backend configured — localStorage cache above already has it */ }
}

}

/* ============================= AUTH (MVP-only — see notes at bottom) ============================= */
function signup(name, dob, email, password){
  const users = readJSON('previsit_users', {});
  if(users[email]) throw new Error('An account with this email already exists.');
  const id = uid();
  users[email] = {id, name, dob, email, password};
  writeJSON('previsit_users', users);
  const session = {id, name, dob, email};
  writeJSON('previsit_session', session);
  return session;
}
function login(email, password){
  const users = readJSON('previsit_users', {});
  const rec = users[email];
  if(!rec || rec.password !== password) throw new Error('Incorrect email or password.');
  const session = {id:rec.id, name:rec.name, dob:rec.dob, email:rec.email};
  writeJSON('previsit_session', session);
  return session;
}
function logout(){ localStorage.removeItem('previsit_session'); State.user=null; State.view='login'; render(); }

  const email = document.getElementById('f_email').value.trim();

/* ============================= GENERATE + SUMMARY ============================= */
async function doGenerate(){
  const btn = document.getElementById('genBtn');
  if(btn){ btn.disabled = true; btn.innerText = '…'; }
  const flags = evaluateRedFlags();
  const screenerFlags = evaluateScreenerFlags();
  const hpi = await generateHPI();
  const ddx = await generateDifferential();
  const reco = await generateClinicalRecommendations();
  const soap = await generateSOAPNote(hpi, ddx, reco, flags);
  const visit = {
    id: uid(), patientId: State.user.id, patientName: State.user.name,
    createdAt: new Date().toISOString(),
    intake: JSON.parse(JSON.stringify(State.intake)),
    category: State.category,
    adaptive: JSON.parse(JSON.stringify(State.adaptive)),
    ros: State.ros.slice(),
    screeners: JSON.parse(JSON.stringify(State.screeners)),
    screenerFlags, flags,
    meds: JSON.parse(JSON.stringify(State.meds)),
    allergies: JSON.parse(JSON.stringify(State.allergies)),
    insurance: JSON.parse(JSON.stringify(State.insurance)),
    photos: State.photos.slice(),
    ownQuestions: State.ownQuestions,
    hpi, ddx, reco, soap,
  };
  await saveVisit(visit);
  State.step = 'summary';
  State.currentVisit = visit;
  render();
}

function buildQuestionsToAsk(visit){
  const qs = [];
  if(visit.flags.some(f=>f.level==='urgent')) qs.push('Given my symptoms, is there anything urgent I should be watching for right now?');
  if(visit.intake.pattern.length && visit.intake.pattern.join(' ').toLowerCase().includes('worse')) qs.push('Since this has been getting worse, what would make you consider further testing or imaging?');
  if(visit.meds.length) qs.push("Could any of my current medications be contributing to this, or interact with anything you're considering prescribing?");
  if(visit.screenerFlags.length) qs.push('You mentioned screening — what would the next step look like if this is positive?');
  qs.push("What's the most likely explanation, and what else are you ruling out?");
  qs.push("What should happen if this doesn't get better — what's the next step?");
  const own = (visit.ownQuestions||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const combined = [...own, ...qs];
  const seen = new Set();
  return combined.filter(q=>{ const k=q.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,7);
}

function copySummary(){

}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function renderApp(){
  const root = document.getElementById('root');

    inner = renderSummary(State.currentVisit);
  } else {
    inner = `<div class="eyebrow">${t('brand')}</div><h1>${t('tagline')}</h1><p class="lede">${t('intro')}</p>` + renderProgress();
    if(State.step===1) inner += renderStep1();
    else if(State.step===2) inner += renderStep2();
    else if(State.step===3) inner += renderStep3();
    else if(State.step===4) inner += renderStep4();
    else if(State.step===5) inner += renderStep5();
    else if(State.step===6) inner += renderStep6();
    else if(State.step===7) inner += renderStep7();
  }
  root.innerHTML = inner;
  if(State.step==='summary'){
    const hc = document.getElementById('historyCard');
    if(hc) hc.innerHTML = renderHistoryList();
  }
}
function render(){
  renderTopbar();
  if(State.view==='login') renderLogin();
  else if(State.view==='dashboard') document.getElementById('root').innerHTML = renderDashboard();
  else renderApp();
  window.scrollTo({top:0, behavior:'instant'});
}

   vitals and exam findings cannot come from a patient self-report form. Wire a
   real EHR/exam system if you want it auto-populated; don't fabricate it.

5. EHR INTEGRATION: buildFHIRBundle()/exportFHIR()/sendToEHR() produce a
   FHIR-*shaped* JSON bundle (Patient/Condition/DocumentReference/
   MedicationStatement/AllergyIntolerance) and POST it to /api/ehr-export if
   present, else download it. This is a data-shaping convenience, NOT a real EHR
   connection. Real EHR integration (Epic, Cerner/Oracle Health, athenahealth,
   etc.) requires: app registration with the health system, a server-side SMART
   on FHIR OAuth2 client, a signed integration/BAA agreement, and usually their
   sandbox certification process — none of which can live in client-side code.
   Budget for a backend engineer and weeks of health-system approval, not a
   config flag.

6. DASHBOARD ACCESS: the "demo" passcode is a placeholder for the UI flow, not
   real authorization. Replace with real clinician accounts and role-based
   access control.

7. HIPAA — WHAT "COMPLIANT" ACTUALLY REQUIRES: this app is not HIPAA compliant
   as shipped, and no amount of front-end code makes it so. The
   Security & Compliance banner on the dashboard says this out loud on purpose —
   don't remove it until the items below are actually true:
     - Signed Business Associate Agreements with every vendor that touches PHI:
       database host, file/photo storage, AI provider, hosting/CDN.
     - Encryption in transit (TLS everywhere — already true if deployed on
       HTTPS) AND at rest (database- and object-storage-level encryption).
     - Real authentication with proper password hashing (bcrypt/argon2) and
       session management — never plaintext passwords like the demo auth above.
     - Role-based access control so patients only ever see their own visits and
       clinician dashboard access is tied to a verified clinician identity.
     - Audit logging: who accessed which patient's data, when.
     - Automatic session timeout and account lockout policies.
     - A documented breach-notification process and a designated Privacy/
       Security Officer, per the HIPAA Security Rule's administrative
       safeguards — this is a policy requirement, not a code change.
     - Minimum-necessary data handling: don't store or transmit more PHI than
       each feature needs (e.g., don't send photos to a summarization endpoint
       that doesn't need them).
   Practically: use a HIPAA-eligible backend (AWS/GCP/Azure with a signed BAA,
   or a healthcare-specific platform like Supabase's HIPAA add-on, Truepill,
   or similar), and have a compliance review before any real patient data
   touches this app.

8. RED FLAGS & QUESTION BANK: evaluateRedFlags() and ADAPTIVE_QUESTIONS above
   are the clinical core of this app, written as plain, readable rule tables on
   purpose — so a physician can review and edit them directly. The new
   DIFFERENTIAL_CONSIDERATIONS and CLINICAL_RECOMMENDATIONS tables follow the
   same pattern for the same reason: a physician should own and edit this
   content, AI backend or not.
